<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Slide</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .slide-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #0070f3;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <h1>Welcome to your Sample Slide!</h1>
        <p>This is located at <code>/slides/nameofslide.html</code>.</p>
        <p>You can upload more HTML files to the <strong>slides</strong> folder and they will be available here.</p>
    </div>
</body>
</html>
